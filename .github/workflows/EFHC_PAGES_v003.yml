name: EFHC — React archive import and Pages DEMO (v003)

on:
  push:
    branches: [main]
    paths:
      - 'import/*.zip'
      - '.github/workflows/efhc-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: efhc-pages-main
  cancel-in-progress: false

jobs:
  build:
    # A successful import deletes the ZIP in its own bot commit. Do not rebuild on that deletion.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[efhc-demo-import]') }}
    name: Import exact ZIP, build real React, update main, clean import
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Restore bundled DEMO builder tools (self-contained YAML)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts
          cat > scripts/import_frontend.py <<'EFHC_BUNDLED_IMPORT_FRONTEND_PY'
          #!/usr/bin/env python3
          """Import only EFHC browser runtime from an uploaded FRONTEND zip.
          
          No repository workspace files, old reports, backend, env files or tests are
          extracted. This runs in CI and fails closed on malformed archives.
          """
          import argparse
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import shutil
          import stat
          import sys
          from zipfile import ZipFile, BadZipFile
          
          FILES = {
              'frontend/package.json',
              'frontend/package-lock.json',
              'frontend/tsconfig.json',
              'frontend/next-env.d.ts',
              'frontend/next.config.js',
              'frontend/postcss.config.js',
              'frontend/.efhc-build-id',
              'frontend/release-assets-manifest.json',
          }
          SUBTREES = ('frontend/src/', 'frontend/public/')
          MAX_ZIP_BYTES = 100 * 1024 * 1024
          MAX_FILE_BYTES = 50 * 1024 * 1024
          MAX_EXTRACT_BYTES = 220 * 1024 * 1024
          MAX_ENTRIES = 10000
          VERSION_RE = re.compile(r'^FRONTEND_v([0-9]{1,7})$')
          EXCLUDED_FILE = re.compile(r'(^|/)(\.env(?:\.|$)|.*\.(?:log|pem|key|p12|pfx|sqlite|db|zip|map)$)', re.I)
          
          
          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument('--import-dir', default='import')
              ap.add_argument('--target', default='site/frontend')
              ap.add_argument('--metadata', default='site/RELEASE.json')
              args = ap.parse_args()
              root = Path.cwd()
              incoming = sorted((root / args.import_dir).glob('*.zip'))
              if len(incoming) != 1:
                  raise ValueError(f'Expected exactly one ZIP in {args.import_dir}/, found {len(incoming)}')
              archive = incoming[0]
              if archive.stat().st_size > MAX_ZIP_BYTES:
                  raise ValueError('ZIP exceeds configured size limit')
              source_sha = hashlib.sha256(archive.read_bytes()).hexdigest()
              selected = []
              version = None
              with ZipFile(archive, 'r') as z:
                  infos = z.infolist()
                  if len(infos) > MAX_ENTRIES:
                      raise ValueError('ZIP contains too many entries')
                  if z.testzip() is not None:
                      raise ValueError('ZIP CRC verification failed')
                  seen = set()
                  for info in infos:
                      name = info.filename
                      p = PurePosixPath(name)
                      if (name.startswith('/') or '\\' in name or '..' in p.parts or
                              any(part in ('', '.') for part in p.parts) or '\x00' in name):
                          raise ValueError(f'Unsafe ZIP path: {name}')
                      if name in seen:
                          raise ValueError(f'Duplicate ZIP entry: {name}')
                      seen.add(name)
                      mode = (info.external_attr >> 16) & 0xFFFF
                      if stat.S_ISLNK(mode):
                          raise ValueError(f'Symlink not allowed: {name}')
                      if name == 'VERSION':
                          version = z.read(info).decode('utf-8').strip()
                      if info.is_dir():
                          continue
                      if name in FILES or name.startswith(SUBTREES):
                          if EXCLUDED_FILE.search(name):
                              continue
                          if info.file_size > MAX_FILE_BYTES:
                              raise ValueError(f'Runtime file too large: {name}')
                          selected.append(info)
                  if not version or not VERSION_RE.fullmatch(version):
                      raise ValueError('Missing or invalid VERSION: expected FRONTEND_vNNN')
                  old_release = root / args.metadata
                  if old_release.is_file():
                      previous = json.loads(old_release.read_text(encoding='utf-8'))
                      old_version = previous.get('source_version', '')
                      old_match = VERSION_RE.fullmatch(old_version)
                      if old_match:
                          new_sequence = int(VERSION_RE.fullmatch(version).group(1))
                          old_sequence = int(old_match.group(1))
                          if new_sequence < old_sequence:
                              raise ValueError(f'Archive downgrade blocked: {version} < {old_version}')
                          if new_sequence == old_sequence and previous.get('source_archive_sha256') != source_sha:
                              raise ValueError('Conflicting archive content at the same release version')
                  required = {'frontend/package.json', 'frontend/package-lock.json', 'frontend/next.config.js', 'frontend/tsconfig.json'}
                  missing = required - {x.filename for x in selected}
                  if missing:
                      raise ValueError(f'Missing frontend files: {sorted(missing)}')
                  if not any(x.filename.startswith('frontend/src/pages/') for x in selected):
                      raise ValueError('No React Pages Router sources found')
                  if sum(x.file_size for x in selected) > MAX_EXTRACT_BYTES:
                      raise ValueError('Runtime source exceeds configured size limit')
                  target = root / args.target
                  fresh = target.with_name(target.name + '.staging')
                  if fresh.exists():
                      shutil.rmtree(fresh)
                  fresh.mkdir(parents=True)
                  try:
                      for info in selected:
                          relative = PurePosixPath(info.filename).relative_to('frontend')
                          path = fresh.joinpath(*relative.parts)
                          path.parent.mkdir(parents=True, exist_ok=True)
                          with z.open(info) as src, path.open('wb') as dst:
                              shutil.copyfileobj(src, dst)
                      if target.exists():
                          shutil.rmtree(target)
                      fresh.rename(target)
                  finally:
                      if fresh.exists():
                          shutil.rmtree(fresh)
              metadata = {
                  'schema': 'EFHC_DEMO_SOURCE_V1',
                  'source_version': version,
                  'source_archive_name': archive.name,
                  'source_archive_sha256': source_sha,
                  'runtime_files_imported': len(selected),
                  'excluded': ['backend', 'docs', 'reports', 'ops', 'tests', 'workflow files from archive', 'root DEMO HTML', 'secrets', 'logs'],
              }
              out = root / args.metadata
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_text(json.dumps(metadata, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
              print(f'EFHC_IMPORT_OK version={version} files={len(selected)} sha256={source_sha}', flush=True)
          
          
          if __name__ == '__main__':
              try:
                  main()
              except (BadZipFile, OSError, ValueError, UnicodeError) as exc:
                  print(f'EFHC_IMPORT_FAIL_CLOSED: {exc}', file=sys.stderr)
                  raise SystemExit(1)
          EFHC_BUNDLED_IMPORT_FRONTEND_PY
          cat > scripts/prepare_pages.py <<'EFHC_BUNDLED_PREPARE_PAGES_PY'
          #!/usr/bin/env python3
          """Transform an ephemeral COPY of actual React source for safe static export.
          
          The imported source tree site/frontend is never changed by this script.
          """
          import argparse
          import json
          from pathlib import Path
          import shutil
          import sys
          
          NEXT_CONFIG = '''/** EFHC isolated GitHub Pages DEMO; generated for an ephemeral build only. */
          const basePath = process.env.EFHC_DEMO_BASEPATH || '';
          module.exports = {
            reactStrictMode: true,
            output: 'export',
            basePath,
            assetPrefix: basePath,
            trailingSlash: true,
            images: { unoptimized: true },
            typescript: { ignoreBuildErrors: false },
            experimental: { cpus: 2 },
          };
          '''
          
          SAFETY = r'''/* EFHC Pages DEMO: block external and live operations. */
          (function () {
            'use strict';
            var base = '__BASE_PATH__';
            var nativeFetch = window.fetch.bind(window);
            var apiHub = JSON.stringify([
              {id:1,code:'efhc_buy',title:'EFHC Shop',url:'#',sort_order:1,is_active:true},
              {id:2,code:'vip_getgems',title:'EFHC VIP NFT',url:'#',sort_order:2,is_active:true},
              {id:3,code:'efhc_ceo',title:'EFHC CEO',url:'#',sort_order:3,is_active:true},
              {id:4,code:'efhc_admin',title:'EFHC Admin',url:'#',sort_order:4,is_active:true}
            ]);
            function apiResponse(path) {
              var data = path.endsWith('/hub/links') ? apiHub : '{"detail":"EFHC_DEMO_READ_ONLY","demo":true}';
              return new Response(data, {status: path.endsWith('/hub/links') ? 200 : 503,
                headers: {'content-type':'application/json;charset=utf-8','cache-control':'no-store'}});
            }
            function isStatic(path) {
              return path.startsWith(base + '/_next/') || path.startsWith(base + '/assets/') ||
                path.startsWith(base + '/locale/') || path.startsWith(base + '/faq/') ||
                path.startsWith(base + '/audio/') || path.startsWith(base + '/fonts/') ||
                path === base + '/manifest.webmanifest' || path === base + '/favicon.ico';
            }
            window.__EFHC_DEMO_READ_ONLY__ = true;
            window.fetch = function(resource, init) {
              var raw = typeof resource === 'string' ? resource : resource && resource.url;
              var url;
              try { url = new URL(raw || '', location.href); } catch (_) { return Promise.resolve(apiResponse('/invalid')); }
              var method = String(init && init.method || resource && resource.method || 'GET').toUpperCase();
              if (url.pathname.startsWith('/api/') || url.pathname.startsWith(base + '/api/'))
                return Promise.resolve(apiResponse(url.pathname));
              if (url.origin !== location.origin || !['GET','HEAD'].includes(method))
                return Promise.resolve(apiResponse('/blocked'));
              if (isStatic(url.pathname) || url.pathname.startsWith(base + '/'))
                return nativeFetch(resource, init);
              return Promise.resolve(apiResponse('/blocked'));
            };
            var nativeOpen = XMLHttpRequest.prototype.open;
            var nativeSend = XMLHttpRequest.prototype.send;
            XMLHttpRequest.prototype.open = function(method,url) {
              this.__efhcBlocked = true;
              try {
                var parsed = new URL(url, location.href);
                this.__efhcBlocked = parsed.origin !== location.origin ||
                  !['GET','HEAD'].includes(String(method).toUpperCase()) ||
                  parsed.pathname.startsWith('/api/') || parsed.pathname.startsWith(base+'/api/');
              } catch (_) {}
              if (!this.__efhcBlocked) return nativeOpen.apply(this, arguments);
              return nativeOpen.call(this, 'GET', 'data:application/json,{"detail":"EFHC_DEMO_READ_ONLY"}', true);
            };
            XMLHttpRequest.prototype.send = function() {return nativeSend.apply(this,arguments);};
            try { navigator.sendBeacon = function(){return false;}; } catch (_) {}
            window.WebSocket = function(){throw new Error('EFHC_DEMO_NETWORK_DISABLED');};
            window.EventSource = function(){throw new Error('EFHC_DEMO_NETWORK_DISABLED');};
            var nativeWindowOpen = window.open;
            window.open = function(url) {
              try {if (new URL(url || '',location.href).origin !== location.origin) return null;} catch (_) {return null;}
              return nativeWindowOpen.apply(window,arguments);
            };
            document.addEventListener('click',function(event) {
              var target=event.target;
              var a=target && target.closest && target.closest('a[href]');
              if (!a) return;
              try {
                var url=new URL(a.href,location.href);
                if(url.origin !== location.origin || (!url.pathname.startsWith(base+'/') && url.pathname !== base)) {
                  event.preventDefault(); event.stopPropagation();
                }
              } catch(_) {event.preventDefault();}
            },true);
            try {
              if(navigator.serviceWorker) {
                navigator.serviceWorker.register = function(){return Promise.reject(new Error('EFHC_DEMO_NO_SERVICE_WORKER'));};
              }
            } catch(_) {}
          })();
          '''
          
          
          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument('--source', required=True)
              ap.add_argument('--target', required=True)
              ap.add_argument('--base-path', required=True)
              args = ap.parse_args()
              base = args.base_path.rstrip('/')
              if base and (not base.startswith('/') or '/' in base[1:] or base in ('/.', '/..')):
                  raise ValueError('base-path must be empty or /single-repository-name')
              source, target = Path(args.source), Path(args.target)
              if target.exists():
                  shutil.rmtree(target)
              shutil.copytree(source, target)
              (target / 'next.config.js').write_text(NEXT_CONFIG, encoding='utf-8')
              # GitHub Pages cannot execute Next API handlers. Keep all real USER/ADMIN React pages.
              api = target / 'src/pages/api'
              if api.exists():
                  shutil.rmtree(api)
              # Pages Router custom _error has getInitialProps and cannot be statically exported.
              custom_error = target / 'src/pages/_error.tsx'
              if custom_error.exists():
                  custom_error.unlink()
              doc = target / 'src/pages/_document.tsx'
              content = doc.read_text(encoding='utf-8')
              if 'src="/public-runtime-config.js"' not in content:
                  raise ValueError('Expected runtime-config script not found in actual _document.tsx')
              content = content.replace('src="/public-runtime-config.js"',
                                        f'src="{base}/efhc-demo-safety.js"', 1)
              # Remove Telegram SDK remote script; mock mode has no external network.
              content = content.replace('<script src="https://telegram.org/js/telegram-web-app.js" async />','')
              # Static assets referenced directly from document are not basePath-rewritten by Next.
              content = content.replace('href="/assets/', f'href="{base}/assets/')
              doc.write_text(content, encoding='utf-8')
              safety = SAFETY.replace('__BASE_PATH__', base)
              (target / 'public/efhc-demo-safety.js').write_text(safety, encoding='utf-8')
              (target / 'public/sw.js').unlink(missing_ok=True)
              (target / 'public/runtime-config.json').unlink(missing_ok=True)
              (target / 'public/manifest.webmanifest').unlink(missing_ok=True)
              # The packaged browser demo never receives live service URLs.
              print(f'EFHC_PAGES_TEMP_BUILD_READY base={base!r} source={source} target={target}')
          
          
          if __name__ == '__main__':
              try:
                  main()
              except (OSError, ValueError) as exc:
                  print(f'EFHC_PAGES_PREPARE_FAIL: {exc}', file=sys.stderr)
                  raise SystemExit(1)
          EFHC_BUNDLED_PREPARE_PAGES_PY
          cat > scripts/fix_pages_assets.py <<'EFHC_BUNDLED_FIX_PAGES_ASSETS_PY'
          #!/usr/bin/env python3
          """Normalize original root-absolute public asset URLs for project Pages basePath.
          
          Do not rewrite actual React routes, JSON fixtures or API endpoints.
          """
          import argparse
          from pathlib import Path
          import re
          import sys
          
          PATTERN = re.compile(r'(["\'`(=])/(assets|locale|faq|audio|fonts|images|icons|favicon\.ico|manifest\.webmanifest)(?=[/?#"\'`\s)])')
          
          def main():
              ap=argparse.ArgumentParser()
              ap.add_argument('--directory',required=True)
              ap.add_argument('--base-path',required=True)
              args=ap.parse_args()
              root=Path(args.directory)
              base=args.base_path.rstrip('/')
              if not base or not re.fullmatch(r'/[A-Za-z0-9_.-]+',base):
                  raise ValueError('Invalid Pages repository basePath')
              changed=0
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix not in ('.html','.css','.js'):
                      continue
                  # Never alter the DEMO security blocker while fixing app assets.
                  if p.name=='efhc-demo-safety.js':
                      continue
                  original=p.read_text(encoding='utf-8')
                  updated=PATTERN.sub(lambda m:m.group(1)+base+'/'+m.group(2),original)
                  if updated!=original:
                      p.write_text(updated,encoding='utf-8')
                      changed+=1
              print(f'EFHC_DEMO_PUBLIC_ASSET_BASEPATH_OK files_rewritten={changed}')
          
          if __name__=='__main__':
              try:main()
              except (OSError,ValueError) as e:
                  print('EFHC_ASSET_REWRITE_FAIL '+str(e),file=sys.stderr)
                  raise SystemExit(1)
          EFHC_BUNDLED_FIX_PAGES_ASSETS_PY
          cat > scripts/verify_export.py <<'EFHC_BUNDLED_VERIFY_EXPORT_PY'
          #!/usr/bin/env python3
          """Fail closed if a Pages build has no actual compiled Next output."""
          import argparse
          import hashlib
          from pathlib import Path
          import re
          import sys
          
          def main():
              ap=argparse.ArgumentParser()
              ap.add_argument('--directory', required=True)
              ap.add_argument('--base-path', required=True)
              args=ap.parse_args()
              root=Path(args.directory)
              index=root/'index.html'
              if not index.is_file():
                  raise ValueError('Next static export missing index.html')
              content=index.read_text(encoding='utf-8')
              if '__NEXT_DATA__' not in content and '/_next/' not in content:
                  raise ValueError('index.html does not appear to be a Next.js build')
              js=list((root/'_next'/'static').rglob('*.js')) if (root/'_next'/'static').exists() else []
              css=list((root/'_next'/'static').rglob('*.css')) if (root/'_next'/'static').exists() else []
              if not js or not css:
                  raise ValueError('Next compiled JavaScript/CSS missing')
              base=args.base_path.rstrip('/')
              if base and base+'/_next/' not in content:
                  raise ValueError('Next static asset basePath was not applied')
              if not (root/'efhc-demo-safety.js').is_file():
                  raise ValueError('Read-only network safety file missing')
              # No backend code or uploaded physical/archive logs in Pages published directory.
              forbidden = [p for p in root.rglob('*') if p.is_file() and
                           (p.suffix.lower() in {'.zip','.log','.pem','.key','.db','.sqlite'} or
                            p.name.startswith('.env'))]
              if forbidden:
                  raise ValueError(f'Forbidden published asset: {forbidden[0]}')
              print(f'EFHC_PAGES_EXPORT_PASS js={len(js)} css={len(css)} pages={len(list(root.rglob("*.html")))}')
          
          if __name__=='__main__':
              try:
                  main()
              except (ValueError,OSError) as e:
                  print('EFHC_PAGES_EXPORT_FAIL: '+str(e),file=sys.stderr)
                  raise SystemExit(1)
          EFHC_BUNDLED_VERIFY_EXPORT_PY
          python3 -m py_compile scripts/*.py
          echo "EFHC_BUNDLED_TOOLS_READY=PASS"

      - name: Select source and import browser-runtime only
        id: source
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(import/*.zip)
          if (( ${#packages[@]} > 1 )); then
            echo 'ERROR: Keep exactly one version ZIP in import/'; exit 1
          fi
          if (( ${#packages[@]} == 1 )); then
            python3 scripts/import_frontend.py --import-dir import --target site/frontend --metadata site/RELEASE.json
            echo 'had_import=true' >> "$GITHUB_OUTPUT"
          else
            if [[ "$GITHUB_EVENT_NAME" != 'workflow_dispatch' ]]; then
              echo 'ERROR: No import ZIP in a push-triggered build'; exit 1
            fi
            test -f site/frontend/package-lock.json
            test -f site/RELEASE.json
            echo 'had_import=false' >> "$GITHUB_OUTPUT"
            echo 'Manual rebuild of already imported React source'
          fi
          test -f import/README.md || { echo "Missing persistent import/README.md"; exit 1; }
          cat site/RELEASE.json

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/frontend/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare isolated static DEMO from actual React
        shell: bash
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          python3 scripts/prepare_pages.py \
            --source site/frontend \
            --target "$RUNNER_TEMP/efhc-demo-build" \
            --base-path "/${REPO_NAME}"

      - name: Install exact frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/efhc-demo-build"
          npm ci --no-audit --no-fund

      - name: Compile production React/Next for Pages (no backend)
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_EFHC_E2E_TONCONNECT_MOCK: '1'
          NEXT_PUBLIC_EFHC_E2E_DISABLE_TONCONNECT_RESTORE: '1'
          NEXT_PUBLIC_EFHC_ADMIN_VISUAL_PROOF: '1'
          NEXT_PUBLIC_EFHC_OBSERVABILITY_VISUAL_PROOF: '1'
          NODE_OPTIONS: '--max-old-space-size=6144'
          EFHC_DEMO_BASEPATH: /${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/efhc-demo-build"
          ./node_modules/.bin/next build --webpack

      - name: Correct absolute asset URLs for project Pages
        shell: bash
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          python3 scripts/fix_pages_assets.py \
            --directory "$RUNNER_TEMP/efhc-demo-build/out" \
            --base-path "/${REPO_NAME}"

      - name: Fail closed if real React static export is missing
        shell: bash
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          python3 scripts/verify_export.py \
            --directory "$RUNNER_TEMP/efhc-demo-build/out" \
            --base-path "/${REPO_NAME}"

      - name: Commit ONLY browser source, then clean import/
        shell: bash
        env:
          HAD_IMPORT: ${{ steps.source.outputs.had_import }}
        run: |
          set -euo pipefail
          if [[ "$HAD_IMPORT" == 'true' ]]; then
            # Deletion is strictly AFTER a successful real React build.
            rm -f -- import/*.zip
            touch import/.gitkeep
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A -- site/frontend site/RELEASE.json import/
            if ! git diff --cached --quiet; then
              git commit -m 'chore(demo): import verified React runtime; clean import [efhc-demo-import]'
              git push origin HEAD:main
            fi
          fi
          test -f import/README.md
          test -z "$(find import -maxdepth 1 -name '*.zip' -print -quit)"
          echo 'IMPORT_CLEAN=PASS'

      - name: Upload compiled React to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/efhc-demo-build/out

  deploy:
    name: Publish real React DEMO
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
