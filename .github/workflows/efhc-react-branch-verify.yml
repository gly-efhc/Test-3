name: EFHC React branch qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/frontend/**'
      - 'site/ci/pages-tools/**'
      - '.github/workflows/efhc-react-branch-verify.yml'

permissions:
  contents: read

concurrency:
  group: efhc-react-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: React v866 canonical CSS build and export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/frontend/package-lock.json
      - name: Prepare exact React Pages source
        run: |
          python3 site/ci/pages-tools/prepare_pages.py --source site/frontend --target "$RUNNER_TEMP/efhc-react-build" --base-path /Test-3
      - name: Install locked dependencies
        working-directory: ${{ runner.temp }}/efhc-react-build
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify CSS routing and canonical source
        id: source_regressions
        continue-on-error: true
        working-directory: ${{ runner.temp }}/efhc-react-build
        run: |
          node --test src/reconstruction/verify-v866-canonical-css-branch-v915.test.mjs
          node --test src/reconstruction/verify-*.test.mjs
      - name: Build and static-export actual React
        working-directory: ${{ runner.temp }}/efhc-react-build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_EFHC_E2E_TONCONNECT_MOCK: '0'
          NEXT_PUBLIC_EFHC_PAGES_PREVIEW: '1'
          NEXT_PUBLIC_EFHC_E2E_DISABLE_TONCONNECT_RESTORE: '0'
          NEXT_PUBLIC_EFHC_ADMIN_VISUAL_PROOF: '1'
          NEXT_PUBLIC_EFHC_OBSERVABILITY_VISUAL_PROOF: '1'
          NODE_OPTIONS: --max-old-space-size=6144
          EFHC_DEMO_BASEPATH: /Test-3
        run: ./node_modules/.bin/next build --webpack
      - name: Verify actual exported pages
        run: |
          python3 site/ci/pages-tools/fix_pages_assets.py --directory "$RUNNER_TEMP/efhc-react-build/out" --base-path /Test-3
          python3 site/ci/pages-tools/verify_export.py --directory "$RUNNER_TEMP/efhc-react-build/out" --base-path /Test-3
      - name: Capture mobile screenshots from compiled React (read-only)
        id: visual_capture
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/efhc-branch-www"
          DEST="$RUNNER_TEMP/efhc-react-mobile-screens"
          mkdir -p "$ROOT" "$DEST"
          ln -sfn "$RUNNER_TEMP/efhc-react-build/out" "$ROOT/Test-3"
          python3 -m http.server 19248 --bind 127.0.0.1 --directory "$ROOT" >"$DEST/local-http.log" 2>&1 &
          HTTP_PID=$!
          trap 'kill "$HTTP_PID" 2>/dev/null || true' EXIT
          sleep 2
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          for route in hub browser-shop panels exchange tasks referrals ranks web-profile faq withdraw admin; do
            timeout 30s "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=390,844 --virtual-time-budget=4000 --screenshot="$DEST/${route}.png" "http://127.0.0.1:19248/Test-3/${route}/" >"$DEST/${route}.log" 2>&1 || echo "CAPTURE_FAIL:${route}" | tee -a "$DEST/failed.log"
          done
          # OWNER Theme03 is the screenshot authority. Seed only the isolated Chrome profile;
          # never change application defaults or the frozen CSS for visual verification.
          cat >"$ROOT/Test-3/__efhc_visual_theme03.html" <<'EFHC_CT03'
          <!doctype html><meta charset="utf-8"><script>
          localStorage.setItem('EFHC_USER_SETTINGS_V1',JSON.stringify({
            lang:'ru',theme_mode:'dark',interface_settings_version:4,color_theme_id:'CT-03',global_theme_id:'03',
            interface_variants:{HS:'HS-03',SC:'SC-02',HU:'HU-01'}
          }));
          location.replace('/Test-3/hub/');
          </script>
          EFHC_CT03
          timeout 30s "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=440,915 --virtual-time-budget=5000 --user-data-dir="$RUNNER_TEMP/efhc-browser-ct03" --screenshot="$DEST/hub-ct03-owner-viewport.png" "http://127.0.0.1:19248/Test-3/__efhc_visual_theme03.html" >"$DEST/hub-ct03-owner-viewport.log" 2>&1 || echo "CAPTURE_FAIL:hub-ct03-owner-viewport" | tee -a "$DEST/failed.log"
          test -s "$ROOT/Test-3/SHOP_v866.html"
          sha256sum "$ROOT/Test-3/SHOP_v866.html" | tee "$DEST/SHOP_v866.sha256"
          test "$(cut -d' ' -f1 "$DEST/SHOP_v866.sha256")" = 1c9f0916f562c0d3c407670741fc8f555d43cc26684c2472d242175d60722b46
          timeout 30s "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=440,915 --virtual-time-budget=5000 --screenshot="$DEST/SHOP_v866.html.png" "http://127.0.0.1:19248/Test-3/SHOP_v866.html" >"$DEST/SHOP_v866.html.log" 2>&1 || echo "CAPTURE_FAIL:SHOP_v866.html" | tee -a "$DEST/failed.log"
          ls -lah "$DEST"/*.png || true
      - name: Preserve mobile screenshots for source-parity inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: efhc-v866-react-mobile-screens
          path: ${{ runner.temp }}/efhc-react-mobile-screens/
          if-no-files-found: warn
          retention-days: 5
      - name: Preserve compiled React preview for visual comparison
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: efhc-react-v866-parity-preview
          path: ${{ runner.temp }}/efhc-react-build/out/
          if-no-files-found: error
          retention-days: 5
      - name: Gate release candidate against legacy regression failures
        if: always()
        env:
          SOURCE_OUTCOME: ${{ steps.source_regressions.outcome }}
        run: |
          echo "EFHC_BRANCH_LEGACY_REGRESSION_OUTCOME=$SOURCE_OUTCOME"
          if [ "$SOURCE_OUTCOME" != success ]; then
            echo "::error::Source regression tests failed; build outcome remains separately visible. Do not merge."
            exit 1
          fi
