# EFHC cycle0032: read-only live Neon TEST smoke, no production DB access.
# Secrets are accessed only by GitHub runner and never committed or printed.
name: EFHC cycle0032 - Neon TEST read-only
on:
  push:
    branches:
      - cycle0032/demo-backend-migration
    paths:
      - .github/workflows/efhc-cycle0032-neon-test.yml
      - demo_backend/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: efhc-cycle0032-neon-smoke
  cancel-in-progress: true

jobs:
  live-neon-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEON_TEST_DSN: ${{ secrets.EFHC_NEON_TEST_DATABASE_URL || secrets.NEON_TEST_DATABASE_URL || secrets.NEON_DATABASE_URL || secrets.NEON_CONNECTION_STRING || secrets.EFHC_DATABASE_URL }}
      STAGING_PROJECT_ID: ${{ secrets.EFHC_STAGING_PROJECT_ID }}
      STAGING_EXPECTED_PROJECT_ID: ${{ secrets.EFHC_STAGING_EXPECTED_PROJECT_ID }}
      NEON_API_TOKEN: ${{ secrets.NEON_API_KEY || secrets.EFHC_NEON_API_KEY || secrets.NEON_API_TOKEN || secrets.NEON_TOKEN }}
      EXPECTED_NEON_TEST_HOST: ep-fragrant-feather-zaribpm5.c-2.eu-west-2.aws.neon.tech
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install smoke dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4'
      - name: Diagnose configured secrets without disclosing values
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          raw = os.environ.get("NEON_TEST_DSN", "").strip()
          token = os.environ.get("NEON_API_TOKEN", "").strip()
          origin = "postgresql" if raw.startswith(("postgresql://", "postgres://", "postgresql+asyncpg://")) else ("name_or_other" if raw else "absent")
          expected = "fragrant-mountain-35143707"
          project = os.environ.get("STAGING_PROJECT_ID", "").strip()
          asserted = os.environ.get("STAGING_EXPECTED_PROJECT_ID", "").strip()
          lines = [
              "EFHC_CYCLE0032_STAGING_DIAGNOSTIC",
              "database_secret_present=" + str(bool(raw)).lower(),
              "database_secret_format=" + origin,
              "api_key_secret_present=" + str(bool(token)).lower(),
              "project_secret_present=" + str(bool(project)).lower(),
              "project_matches_test=" + str(project == expected).lower(),
              "expected_project_secret_present=" + str(bool(asserted)).lower(),
              "expected_project_matches_test=" + str(asserted == expected).lower(),
          ]
          Path(os.environ["RUNNER_TEMP"], "efhc-staging-diagnostic.txt").write_text("\n".join(lines)+"\n", encoding="utf-8")
          print("EFHC_STAGING_SECRET_DIAG_WRITTEN")
          PY
      - name: Check exact TEST Neon branch and existing EFHC tables without writes
        shell: bash
        run: |
          python - <<'PY'
          import os
          import json
          from urllib.parse import urlsplit, parse_qs, urlencode
          from urllib.request import Request, urlopen
          from psycopg import connect

          raw = os.environ.get("NEON_TEST_DSN", "").strip()
          api_token = os.environ.get("NEON_API_TOKEN", "").strip()
          if not raw and api_token:
              query = urlencode({
                  "branch_id": "br-sparkling-truth-zaa3zrqq",
                  "database_name": "neondb",
                  "role_name": "neondb_owner",
                  "pooled": "false",
              })
              url = "https://console.neon.tech/api/v2/projects/fragrant-mountain-35143707/connection_uri?" + query
              req = Request(url, headers={"Authorization": "Bearer " + api_token,
                                          "Accept": "application/json"})
              try:
                  with urlopen(req, timeout=15) as resp:
                      raw = str(json.load(resp).get("uri", "")).strip()
              except Exception as exc:
                  raise SystemExit("NEON_API_CONNECTION_URI_UNAVAILABLE: check API key access to exact EFHC_Nektron_Test project") from None
              if not raw:
                  raise SystemExit("NEON_API_NO_CONNECTION_URI")
              print("NEON_TEST_CREDENTIAL_SOURCE=API_KEY")
          if not raw:
              raise SystemExit("NEON_TEST_SECRET_MISSING: no recognized TEST DSN or Neon API key in this repository Actions context")
          expected_project = "fragrant-mountain-35143707"
          configured_project = os.environ.get("STAGING_PROJECT_ID", "").strip()
          configured_expected = os.environ.get("STAGING_EXPECTED_PROJECT_ID", "").strip()
          if configured_expected and configured_expected != expected_project:
              raise SystemExit("NEON_TEST_EXPECTED_PROJECT_MISMATCH: refuse non-test project")
          if configured_project and configured_project != expected_project:
              raise SystemExit("NEON_TEST_STAGING_PROJECT_MISMATCH: refuse non-test project")
          if not raw.startswith(("postgresql://", "postgres://", "postgresql+asyncpg://")):
              raise SystemExit("EFHC_STAGING_DATABASE_NOT_DSN: staging secret does not contain PostgreSQL URL")
          if raw.startswith("postgresql+asyncpg://"):
              raw = "postgresql://" + raw[len("postgresql+asyncpg://"):]
          parsed = urlsplit(raw)
          expected = os.environ["EXPECTED_NEON_TEST_HOST"]
          allowed_hosts = {expected, expected.replace(".c-2.", "-pooler.c-2.")}
          if parsed.scheme not in {"postgresql", "postgres"} or parsed.hostname not in allowed_hosts:
              raise SystemExit("NEON_TEST_HOST_MISMATCH: refuse unknown or production database")
          if parsed.path != "/neondb":
              raise SystemExit("NEON_TEST_DATABASE_MISMATCH: expected neondb")
          sslmode = parse_qs(parsed.query).get("sslmode", [""])[0].lower()
          if sslmode not in {"require", "verify-full"}:
              raise SystemExit("NEON_TEST_TLS_REQUIRED: SSL mode require/verify-full")
          with connect(raw, connect_timeout=12) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("SET TRANSACTION READ ONLY")
                  cursor.execute("""
                    SELECT table_schema, table_type, count(*)
                    FROM information_schema.tables
                    WHERE table_schema IN ('efhc_core','efhc_admin','efhc_demo_public')
                    GROUP BY table_schema, table_type
                    ORDER BY table_schema, table_type
                  """)
                  groups = {(schema, typ): int(num) for schema, typ, num in cursor.fetchall()}
                  tables = sum(groups.get((s,"BASE TABLE"),0) for s in ("efhc_core","efhc_admin"))
                  views = groups.get(("efhc_demo_public","VIEW"),0)
                  if tables < 54 or views < 10:
                      raise SystemExit(f"NEON_TEST_SCHEMA_INVALID: physical={tables}, views={views}")
                  cursor.execute("SELECT count(*) FROM efhc_core.users")
                  users = cursor.fetchone()[0]
                  cursor.execute("SELECT count(*) FROM efhc_core.panels")
                  panels = cursor.fetchone()[0]
                  cursor.execute("SELECT count(*) FROM efhc_core.efhc_transfers_log")
                  ledger = cursor.fetchone()[0]
                  cursor.execute("SELECT count(*) FROM efhc_core.bank_metrics_snapshot")
                  snapshots = cursor.fetchone()[0]
                  if users == 0 or snapshots == 0:
                      raise SystemExit("NEON_TEST_DATA_MISSING")
                  print(f"EFHC_NEON_TEST_READONLY_PASS tables={tables} views={views} users={users} panels={panels} ledger={ledger} snapshots={snapshots}")
              connection.rollback()
          PY

      - name: Upload redacted staging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle0032-neon-secret-diagnostics
          path: ${{ runner.temp }}/efhc-staging-diagnostic.txt
          if-no-files-found: error
          retention-days: 1
