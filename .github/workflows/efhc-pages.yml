name: EFHC — import React ZIP and publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'import/*.zip'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: efhc-pages-main
  cancel-in-progress: false

jobs:
  build:
    # A successful import deletes the ZIP in its own bot commit. Do not rebuild on that deletion.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[efhc-demo-import]') }}
    name: Import exact ZIP, build real React, update main, clean import
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Select source and import browser-runtime only
        id: source
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(import/*.zip)
          if (( ${#packages[@]} > 1 )); then
            echo 'ERROR: Keep exactly one version ZIP in import/'; exit 1
          fi
          if (( ${#packages[@]} == 1 )); then
            python3 scripts/import_frontend.py --import-dir import --target site/frontend --metadata site/RELEASE.json
            echo 'had_import=true' >> "$GITHUB_OUTPUT"
          else
            if [[ "$GITHUB_EVENT_NAME" != 'workflow_dispatch' ]]; then
              echo 'ERROR: No import ZIP in a push-triggered build'; exit 1
            fi
            test -f site/frontend/package-lock.json
            test -f site/RELEASE.json
            echo 'had_import=false' >> "$GITHUB_OUTPUT"
            echo 'Manual rebuild of already imported React source'
          fi
          cat site/RELEASE.json

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/frontend/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare isolated static DEMO from actual React
        shell: bash
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          python3 scripts/prepare_pages.py \
            --source site/frontend \
            --target "$RUNNER_TEMP/efhc-demo-build" \
            --base-path "/${REPO_NAME}"

      - name: Install exact frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/efhc-demo-build"
          npm ci --no-audit --no-fund

      - name: Compile production React/Next for Pages (no backend)
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_EFHC_E2E_TONCONNECT_MOCK: '1'
          NEXT_PUBLIC_EFHC_E2E_DISABLE_TONCONNECT_RESTORE: '1'
          NEXT_PUBLIC_EFHC_ADMIN_VISUAL_PROOF: '1'
          NEXT_PUBLIC_EFHC_OBSERVABILITY_VISUAL_PROOF: '1'
          NODE_OPTIONS: '--max-old-space-size=6144'
          EFHC_DEMO_BASEPATH: /${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/efhc-demo-build"
          ./node_modules/.bin/next build --webpack

      - name: Correct absolute asset URLs for project Pages
        shell: bash
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          python3 scripts/fix_pages_assets.py \
            --directory "$RUNNER_TEMP/efhc-demo-build/out" \
            --base-path "/${REPO_NAME}"

      - name: Fail closed if real React static export is missing
        shell: bash
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          python3 scripts/verify_export.py \
            --directory "$RUNNER_TEMP/efhc-demo-build/out" \
            --base-path "/${REPO_NAME}"

      - name: Commit ONLY browser source, then clean import/
        shell: bash
        env:
          HAD_IMPORT: ${{ steps.source.outputs.had_import }}
        run: |
          set -euo pipefail
          if [[ "$HAD_IMPORT" == 'true' ]]; then
            # Deletion is strictly AFTER a successful real React build.
            rm -f -- import/*.zip
            touch import/.gitkeep
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A -- site/frontend site/RELEASE.json import/
            if ! git diff --cached --quiet; then
              git commit -m 'chore(demo): import verified React runtime; clean import [efhc-demo-import]'
              git push origin HEAD:main
            fi
          fi
          test -z "$(find import -maxdepth 1 -name '*.zip' -print -quit)"
          echo 'IMPORT_CLEAN=PASS'

      - name: Upload compiled React to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/efhc-demo-build/out

  deploy:
    name: Publish real React DEMO
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
