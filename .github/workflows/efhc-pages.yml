# EFHC — fast development Pages deployment; full rendered USER acceptance is manual.
# OWNER one-time bootstrap. The ZIP updates site/ci/pages-tools without modifying this workflow.
# Requires GitHub Pages / GitHub Actions to be enabled.
name: EFHC — React DEMO Pages

on:
  workflow_dispatch:
    inputs:
      full_review:
        description: "Run complete rendered browser, regression and quality acceptance checks"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/efhc-pages.yml"

permissions:
  contents: read

concurrency:
  group: efhc-test3-main
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  publish:
    name: Build real React and publish to Pages
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Checkout imported React source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Initialize Pages pre-deploy diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/efhc-pages-diagnostics"
          printf 'EFHC_PAGES_DIAGNOSTICS_START=run:%s attempt:%s commit:%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" \
            | tee "$RUNNER_TEMP/efhc-pages-diagnostics/metadata.log"

      - name: Validate committed import source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test -f site/RELEASE.json || { echo 'FAIL: run EFHC Import first (missing site/RELEASE.json)'; exit 1; }
          test -f site/frontend/package-lock.json || { echo 'FAIL: imported React source missing'; exit 1; }
          python3 - <<'PYCODE'
          import hashlib, json, pathlib, re
          info = json.loads(pathlib.Path('site/RELEASE.json').read_text(encoding='utf-8'))
          expected = info.get('source_archive_sha256', '')
          if not re.fullmatch(r'[0-9a-f]{64}', expected):
              raise SystemExit('FAIL: invalid RELEASE source archive SHA256')
          zips = sorted(pathlib.Path('import').glob('*.zip'))
          if len(zips) > 1:
              raise SystemExit('FAIL: multiple ZIP files in import/; retain only the currently imported ZIP')
          if zips:
              actual = hashlib.file_digest(zips[0].open('rb'), 'sha256').hexdigest()
              if actual != expected:
                  raise SystemExit('FAIL: ZIP does not match staged source; run import first')
          print('EFHC_COMMITTED_REACT_SOURCE_VERIFIED=' + expected)
          PYCODE
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import json
          print('source_sha=' + json.load(open('site/RELEASE.json'))['source_archive_sha256'])
          PYCODE

      - name: Load versioned Pages tools imported from ZIP
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="site/ci/pages-tools"
          DEST="$RUNNER_TEMP/efhc-pages-tools"
          for file in prepare_pages.py fix_pages_assets.py verify_export.py browser-smoke.mjs; do
            test -s "$SOURCE/$file" || { echo "Missing Pages tool: $file; run EFHC Import first" >&2; exit 1; }
          done
          mkdir -p "$DEST"
          cp -- "$SOURCE/prepare_pages.py" "$SOURCE/fix_pages_assets.py" "$SOURCE/verify_export.py" "$SOURCE/browser-smoke.mjs" "$DEST/"
          python3 -m py_compile "$DEST/prepare_pages.py" "$DEST/fix_pages_assets.py" "$DEST/verify_export.py"
          node --check "$DEST/browser-smoke.mjs"
          echo 'EFHC_PAGES_VERSIONED_TOOLS_READY=PASS'

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/frontend/package-lock.json

      - name: Configure Pages (manual publish only)
        uses: actions/configure-pages@v6

      - name: Prepare isolated static DEMO from actual React
        shell: bash
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/efhc-pages-tools/prepare_pages.py" \
            --source site/frontend \
            --target "$RUNNER_TEMP/efhc-demo-build" \
            --base-path "/${REPO_NAME}"

      - name: Install exact frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/efhc-demo-build"
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 \
            | tee "$RUNNER_TEMP/efhc-pages-diagnostics/npm-ci.log"

      - name: Require v866 contract and shared-shell integrity
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/efhc-demo-build"
          npm run test:html-react-parity
          node --test tests/regression/current-demo-*.test.mjs
          cd "$GITHUB_WORKSPACE"
          EFHC_FRONTEND_DEPENDENCIES="$RUNNER_TEMP/efhc-demo-build/package.json" node site/ci/parity/generate_shell.mjs --check
          node site/frontend/tests/parity/pages-artifact.test.mjs

      - name: Set up Python for isolated quality scanners
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install optional quality scanners (non-blocking)
        if: ${{ inputs.full_review == true }}
        id: scanner_tools
        continue-on-error: true
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            'bandit>=1.7.9,<2.0.0' 'flake8>=7,<8' 'ruff>=0.5.7,<1' \
            'mypy>=1.11,<2' 'pip-audit==2.10.1' 2>&1 \
            | tee "$RUNNER_TEMP/efhc-pages-diagnostics/quality-tools-install.log"

      - name: Collect security, lint, type and dependency findings (non-blocking)
        if: ${{ inputs.full_review == true }}
        id: quality_prebuild
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          python3 site/frontend/src/reconstruction/ci_predeploy_diagnostics.py \
            --phase prebuild \
            --frontend "$RUNNER_TEMP/efhc-demo-build" \
            --repo "$GITHUB_WORKSPACE" \
            --logs "$RUNNER_TEMP/efhc-pages-diagnostics"

      - name: Collect frontend regression test failures (non-blocking)
        if: ${{ inputs.full_review == true }}
        id: regressions
        continue-on-error: true
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/efhc-demo-build"
          echo 'EFHC_PREDEPLOY_FRONTEND_REGRESSION_START'
          npm run test:frontend-regression 2>&1 \
            | tee "$RUNNER_TEMP/efhc-pages-diagnostics/frontend-regression.log"

      - name: Verify read-only Neon TEST Data API (fast)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          root = "https://ep-fragrant-feather-zaribpm5.apirest.c-2.eu-west-2.aws.neon.tech/neondb/rest/v1"
          origin = "https://gly-efhc.github.io"
          auth_root = "https://ep-fragrant-feather-zaribpm5.neonauth.c-2.eu-west-2.aws.neon.tech/neondb/auth"
          auth_request = urllib.request.Request(auth_root + "/token/anonymous",
              headers={"Origin": origin, "Accept": "application/json"})
          try:
              with urllib.request.urlopen(auth_request, timeout=12) as auth_response:
                  auth_cors = auth_response.headers.get("Access-Control-Allow-Origin")
                  if auth_cors not in (origin, "*"):
                      raise RuntimeError("NEON_AUTH_CORS_DENIED: " + str(auth_cors))
                  auth = json.loads(auth_response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              raise RuntimeError("NEON_AUTH_HTTP_" + str(exc.code) + ": " + exc.read(1400).decode("utf-8", "replace")) from exc
          jwt = auth.get("token")
          if not isinstance(jwt, str) or jwt.count(".") != 2:
              raise RuntimeError("NEON_AUTH_ANONYMOUS_TOKEN_INVALID")
          def read(path):
              request = urllib.request.Request(root + path, headers={"Origin": origin, "Accept": "application/json", "Authorization": "Bearer " + jwt})
              try:
                  api_response = urllib.request.urlopen(request, timeout=12)
              except urllib.error.HTTPError as exc:
                  raise RuntimeError("NEON_DEMO_HTTP_" + str(exc.code) + ": " + exc.read(1400).decode("utf-8", "replace")) from exc
              with api_response as response:
                  cors = response.headers.get("Access-Control-Allow-Origin")
                  if cors not in (origin, "*"):
                      raise RuntimeError("NEON_DEMO_CORS_NOT_ALLOWED: " + str(cors))
                  data = json.loads(response.read().decode("utf-8"))
                  if not isinstance(data, list) or len(data) != 1:
                      raise RuntimeError("NEON_DEMO_INVALID_ROWSET")
                  return data[0]
          bank = read("/bank_overview?select=database_scope,dataset,facts,counters&limit=1")
          if bank.get("database_scope") != "EFHC_Nektron_Test" or bank.get("dataset") != "RECON_CYCLE_0027":
              raise RuntimeError("NEON_DEMO_WRONG_DATABASE")
          facts = bank.get("facts") or {}
          counts = bank.get("counters") or {}
          if facts.get("bank_metrics_integrity_ok") != "1" or counts.get("users_total") != 1000 or counts.get("panels_total") != 4000:
              raise RuntimeError("NEON_DEMO_INTEGRITY_OR_COUNTS_MISMATCH")
          account = read("/accounts?select=global_id,dataset&global_id=eq.0000657667&limit=1")
          if account.get("global_id") != "0000657667" or account.get("dataset") != "RECON_CYCLE_0027":
              raise RuntimeError("NEON_DEMO_ACCOUNT_ROUTING_MISMATCH")
          snap = read("/bootstrap_snapshot?select=bank,users,panels,intents&limit=1")
          if len(snap.get("users") or []) != 1000 or len(snap.get("panels") or []) != 4000 or len(snap.get("intents") or []) != 1000:
              raise RuntimeError("NEON_DEMO_BOOTSTRAP_INCOMPLETE")
          if (snap.get("bank") or {}).get("facts", {}).get("bank_metrics_integrity_ok") != "1":
              raise RuntimeError("NEON_DEMO_BOOTSTRAP_INTEGRITY_MISMATCH")
          for table in ("referrals", "referral_bonuses", "ad_reward_sessions", "task_submissions"):
              row = read("/catalog_rows?select=item&table_name=eq." + table + "&item-%3E%3Eglobal_id=eq.0000657667&limit=1")
              if row.get("item", {}).get("global_id") != "0000657667":
                  raise RuntimeError("NEON_DEMO_TABLE_ROUTING_MISMATCH: " + table)
          print("EFHC_NEON_DEMO_LOGICAL_TABLE_READERS=PASS tables=4 global_id=0000657667")
          print("EFHC_NEON_DEMO_BOOTSTRAP=PASS users=1000 panels=4000 intents=1000")
          print("EFHC_NEON_DEMO_DATA_API=PASS users=1000 panels=4000 CORS=PASS bank=PASS")
          PY

      - name: Compile actual React/Next for Pages (no backend)
        id: compile
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_EFHC_E2E_TONCONNECT_MOCK: '0'
          NEXT_PUBLIC_EFHC_PAGES_PREVIEW: '1'
          NEXT_PUBLIC_EFHC_E2E_DISABLE_TONCONNECT_RESTORE: '1'
          NEXT_PUBLIC_EFHC_ADMIN_VISUAL_PROOF: '1'
          NEXT_PUBLIC_EFHC_OBSERVABILITY_VISUAL_PROOF: '1'
          NODE_OPTIONS: '--max-old-space-size=6144'
          EFHC_DEMO_BASEPATH: /${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/efhc-demo-build"
          ./node_modules/.bin/next build --webpack 2>&1 \
            | tee "$RUNNER_TEMP/efhc-pages-diagnostics/next-build.log"

      - name: Correct absolute public asset URLs for project Pages
        shell: bash
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/efhc-pages-tools/fix_pages_assets.py" \
            --directory "$RUNNER_TEMP/efhc-demo-build/out" \
            --base-path "/${REPO_NAME}" 2>&1 \
            | tee "$RUNNER_TEMP/efhc-pages-diagnostics/asset-fix.log"

      - name: Fail closed if real React static export is missing
        shell: bash
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/efhc-pages-tools/verify_export.py" \
            --directory "$RUNNER_TEMP/efhc-demo-build/out" \
            --base-path "/${REPO_NAME}" 2>&1 \
            | tee "$RUNNER_TEMP/efhc-pages-diagnostics/verify-export.log"

      - name: Collect post-build quality findings (non-blocking)
        if: ${{ inputs.full_review == true }}
        id: quality_postbuild
        continue-on-error: true
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          python3 site/frontend/src/reconstruction/ci_predeploy_diagnostics.py \
            --phase postbuild \
            --frontend "$RUNNER_TEMP/efhc-demo-build" \
            --repo "$GITHUB_WORKSPACE" \
            --logs "$RUNNER_TEMP/efhc-pages-diagnostics"

      - name: Collect Chrome route and UI failures before Pages (non-blocking)
        if: ${{ inputs.full_review == true }}
        id: browser_smoke
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        env:
          EFHC_CI_DIAGNOSTIC_DIR: ${{ runner.temp }}/efhc-pages-diagnostics
        run: |
          set -euo pipefail
          LOG_DIR="$RUNNER_TEMP/efhc-pages-diagnostics"
          mkdir -p "$LOG_DIR"
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo 'EFHC_CHROME_MISSING=FAIL' | tee "$LOG_DIR/browser-smoke.log"
            exit 1
          fi
          export CHROME_BIN
          node --check "$RUNNER_TEMP/efhc-pages-tools/browser-smoke.mjs" 2>&1 \
            | tee "$LOG_DIR/browser-smoke-syntax.log"
          mkdir -p "$RUNNER_TEMP/efhc-pages-http"
          ln -sfn "$RUNNER_TEMP/efhc-demo-build/out" "$RUNNER_TEMP/efhc-pages-http/${GITHUB_REPOSITORY#*/}"
          cd "$RUNNER_TEMP/efhc-pages-http"
          python3 -m http.server 19240 --bind 127.0.0.1 >"$LOG_DIR/local-http.log" 2>&1 &
          HTTP_PID=$!
          trap 'kill "$HTTP_PID" 2>/dev/null || true' EXIT
          node "$RUNNER_TEMP/efhc-pages-tools/browser-smoke.mjs" \
            "http://127.0.0.1:19240/${GITHUB_REPOSITORY#*/}/" 2>&1 | tee "$LOG_DIR/browser-smoke.log"

      - name: Summarize pre-deploy diagnostics, including failures
        if: always()
        continue-on-error: true
        shell: bash
        env:
          EFHC_SOURCE_OUTCOME: ${{ steps.source.outcome }}
          EFHC_COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          EFHC_FRONTEND_TEST_OUTCOME: ${{ steps.regressions.outcome }}
          EFHC_CHROME_TEST_OUTCOME: ${{ steps.browser_smoke.outcome }}
          EFHC_SCANNER_TOOLS_OUTCOME: ${{ steps.scanner_tools.outcome }}
          EFHC_QUALITY_PREBUILD_OUTCOME: ${{ steps.quality_prebuild.outcome }}
          EFHC_QUALITY_POSTBUILD_OUTCOME: ${{ steps.quality_postbuild.outcome }}
          EFHC_COMMIT: ${{ github.sha }}
          EFHC_FULL_REVIEW: ${{ inputs.full_review }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/efhc-pages-diagnostics"
          python3 - <<'EFHC_DIAG_SUMMARY_PY'
          import json, os, pathlib
          report={
              'schema':'efhc.pages.predeploy-diagnostics.v1',
              'commit':os.environ.get('EFHC_COMMIT',''),
              'review_mode': 'full_acceptance' if os.environ.get('EFHC_FULL_REVIEW')=='true' else 'fast_development',
              'rendered_acceptance': 'REQUIRED' if os.environ.get('EFHC_FULL_REVIEW')=='true' else 'NOT_RUN_OWNER_VISUAL_REVIEW',
              'source':os.environ.get('EFHC_SOURCE_OUTCOME','unknown'),
              'compile':os.environ.get('EFHC_COMPILE_OUTCOME','unknown'),
              'frontend_tests':os.environ.get('EFHC_FRONTEND_TEST_OUTCOME','unknown'),
              'chrome_tests':os.environ.get('EFHC_CHROME_TEST_OUTCOME','unknown'),
              'scanner_tools':os.environ.get('EFHC_SCANNER_TOOLS_OUTCOME','unknown'),
              'quality_prebuild':os.environ.get('EFHC_QUALITY_PREBUILD_OUTCOME','unknown'),
              'quality_postbuild':os.environ.get('EFHC_QUALITY_POSTBUILD_OUTCOME','unknown'),
              'test_errors_do_not_block_deploy': True,
              'build_errors_block_deploy': True,
              'backend_ci_executed': False,
          }
          directory=pathlib.Path(os.environ['RUNNER_TEMP'])/'efhc-pages-diagnostics'
          quality=[]
          for phase in ('prebuild','postbuild'):
              item=directory/f'quality-{phase}.json'
              if item.is_file():
                  quality.extend(json.loads(item.read_text(encoding='utf-8')).get('checks',[]))
          report['quality_checks']=quality
          report['quality_counts']={status:sum(q.get('status')==status for q in quality) for status in ('PASS','FAIL','TOOL_ERROR','NOT_AVAILABLE')}
          report['backend_coverage_gap']=not any(q.get('check')=='backend-bandit' and q.get('status')!='NOT_AVAILABLE' for q in quality)
          if report['backend_coverage_gap']:
              print('::warning title=Backend CI coverage gap::Bandit/flake8/Ruff/mypy/pytest backend checks require the private FULL backend; public Pages import contains React only')
          (directory/'predeploy-summary.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          print('EFHC_PREDEPLOY_DIAGNOSTICS='+json.dumps(report,sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('## EFHC Pages — diagnostics before deployment\n\n')
              out.write('| Check | Outcome | Deploy blocked? |\n|---|---|---|\n')
              for label,key,blocking in [
                  ('Import source','source','Yes'),
                  ('Next.js build','compile','Yes'),
                  ('Frontend regression','frontend_tests','No'),
                  ('Chrome smoke','chrome_tests','No'),
                  ('Quality scanner installation','scanner_tools','No'),
                  ('Pre-build security/lint/dependency checks','quality_prebuild','No'),
                  ('Post-build quality checks','quality_postbuild','No')]:
                  out.write(f'| {label} | `{report[key]}` | {blocking} |\n')
              out.write('\n### Individual diagnostic checks\n\n')
              out.write('| Check | Status |\n|---|---|\n')
              for row in quality:
                  out.write(f"| `{row['check']}` | `{row['status']}` |\n")
              if report['backend_coverage_gap']:
                  out.write('\n**Coverage gap:** backend tests/scanners need private FULL source and cannot be certified by public Pages.\n')
              out.write('\nTest failures remain recorded; they are not treated as PASS.\n')
          EFHC_DIAG_SUMMARY_PY

      - name: Upload pre-deploy diagnostic logs, even when tests fail
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: efhc-pages-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/efhc-pages-diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Require rendered USER recovery checks before publication
        if: ${{ inputs.full_review == true }}
        shell: bash
        env:
          EFHC_BROWSER_TOOLS: ${{ runner.temp }}/efhc-browser-tools/package.json
          EFHC_PARITY_ARTIFACTS: ${{ runner.temp }}/efhc-parity-artifacts
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/efhc-browser-tools" playwright-core@1.64.1 --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/efhc-parity-http"
          ln -sfn "$RUNNER_TEMP/efhc-demo-build/out" "$RUNNER_TEMP/efhc-parity-http/${GITHUB_REPOSITORY#*/}"
          python3 -m http.server 19243 --bind 127.0.0.1 --directory "$RUNNER_TEMP/efhc-parity-http" > "$RUNNER_TEMP/efhc-parity-http.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:19243/${GITHUB_REPOSITORY#*/}/ -o /dev/null && break || sleep 1; done
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          export EFHC_REACT_URL=http://127.0.0.1:19243/${GITHUB_REPOSITORY#*/}/
          node site/frontend/tests/parity/demo-functions.mjs
          node site/frontend/tests/parity/bank.mjs
          node site/frontend/tests/parity/panels-colors.mjs
          node site/frontend/tests/parity/browser.mjs
          node site/frontend/tests/parity/interactions.mjs
          node site/frontend/tests/parity/templates.mjs
          node site/frontend/tests/parity/routes.mjs

      - name: Retain USER recovery review artifacts
        if: ${{ always() && inputs.full_review == true }}
        uses: actions/upload-artifact@v4
        with:
          name: efhc-parity-${{ github.sha }}
          path: ${{ runner.temp }}/efhc-parity-artifacts/
          if-no-files-found: warn

      - name: Upload compiled React to Pages
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/efhc-demo-build/out

      - name: Deploy real React to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}


      - name: Report publication status and outstanding diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        env:
          EFHC_PUBLISH_OUTCOME: ${{ steps.deployment.outcome }}
          EFHC_FRONTEND_OUTCOME: ${{ steps.regressions.outcome }}
          EFHC_BROWSER_OUTCOME: ${{ steps.browser_smoke.outcome }}
          EFHC_QUALITY_PREBUILD: ${{ steps.quality_prebuild.outcome }}
          EFHC_QUALITY_POSTBUILD: ${{ steps.quality_postbuild.outcome }}
          EFHC_FULL_REVIEW: ${{ inputs.full_review }}
        run: |
          set -euo pipefail
          if [ "$EFHC_PUBLISH_OUTCOME" = success ]; then
            echo 'EFHC_PAGES_DEPLOYED=YES'
            if [ "$EFHC_FULL_REVIEW" != true ]; then
              echo 'EFHC_PAGES_FAST_DEVELOPMENT=YES FULL_RENDERED_REVIEW=NOT_RUN OWNER_VISUAL_REVIEW=MANUAL'
              printf '### Fast development publication\n\nFull browser and optional quality checks: `NOT_RUN` by OWNER-approved development policy. Required source, contracts, DEMO tests, build and export checks remain blocking.\n' >> "$GITHUB_STEP_SUMMARY"
            elif [ "$EFHC_FRONTEND_OUTCOME" != success ] || [ "$EFHC_BROWSER_OUTCOME" != success ] || [ "$EFHC_QUALITY_PREBUILD" != success ] || [ "$EFHC_QUALITY_POSTBUILD" != success ]; then
              echo '::warning title=EFHC deployed with test failures::See efhc-pages-diagnostics artifact and predeploy-summary.json'
              printf '### Published with outstanding test failures\n\nFrontend: `%s`; Chrome: `%s`; Quality prebuild: `%s`; Quality postbuild: `%s`.\n' \
                "$EFHC_FRONTEND_OUTCOME" "$EFHC_BROWSER_OUTCOME" "$EFHC_QUALITY_PREBUILD" "$EFHC_QUALITY_POSTBUILD" >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'EFHC_PAGES_DEPLOYED_WITH_TESTS_PASS'
            fi
          else
            echo "EFHC_PAGES_DEPLOYED=NO outcome:$EFHC_PUBLISH_OUTCOME"
          fi

  cleanup:
    name: Remove matching source ZIP only after successful deployment
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Verify current release and remove deployed transport ZIP
        shell: bash
        env:
          PUBLISHED_SHA: ${{ needs.publish.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, re
