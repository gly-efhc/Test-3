# Apply the OWNER-approved cycle0032 local diff on its isolated branch.
# Transport bundle is compressed JSON, never a production backend or secret.
name: EFHC cycle0032 - Import source

on:
  push:
    branches:
      - cycle0032/demo-backend-migration
    paths:
      - .github/workflows/efhc-backend-apply.yml
      - .efhc-cycle0032/import_payload.b64.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated development branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node for isolated frontend contract tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply immutable OWNER local changes
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .efhc-cycle0032/import_payload.b64.txt ]; then
            echo 'EFHC_CYCLE0032_IMPORT_ALREADY_APPLIED=PASS'
            exit 0
          fi
          python3 - <<'PY'
          import ast, base64, gzip, hashlib, json, pathlib, subprocess
          import sys

          path = pathlib.Path('.efhc-cycle0032/import_payload.b64.txt')
          expected = '8763296c6ff9b0ef5426a0482e59323c85425ca0934275e98425da66095f4324'
          compressed = base64.b64decode(''.join(path.read_text(encoding='ascii').split()), validate=True)
          if hashlib.sha256(compressed).hexdigest() != expected:
              raise SystemExit('EFHC_IMPORT_SHA256_MISMATCH')
          data = json.loads(gzip.decompress(compressed))
          base = 'fe0ad6ae47ffd09ab40477f14f396b216f8ec545'
          if data.get('schema') != 'efhc.cycle0032.github-import.v1' or data.get('base_sha') != base:
              raise SystemExit('EFHC_IMPORT_BASE_MISMATCH')
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          files, deleted = data['files'], data['deleted']
          if len(files) != 71 or len(deleted) != 43:
              raise SystemExit('EFHC_IMPORT_CHANGESET_COUNT_MISMATCH')
          def validate(p):
              pp = pathlib.PurePosixPath(p)
              if pp.is_absolute() or '..' in pp.parts or len(pp.parts)<2 or str(pp) != p:
                  raise SystemExit('EFHC_IMPORT_BAD_PATH')
              allowed = p.startswith(('site/frontend/','site/ci/','demo_backend/'))
              allowed |= p in ('.github/workflows/efhc-pages.yml','.github/workflows/efhc-parity.yml')
              if not allowed or (p.startswith('demo_backend/.env') and p != 'demo_backend/.env.example'):
                  raise SystemExit('EFHC_IMPORT_PATH_NOT_ALLOWED: '+p)
              return pathlib.Path(p)
          all_paths = list(files)+list(deleted)
          if len(set(all_paths)) != len(all_paths):
              raise SystemExit('EFHC_IMPORT_DUPLICATE_PATH')
          for p in all_paths:
              local = validate(p)
              original = subprocess.run(['git','show',base+':'+p],capture_output=True)
              if original.returncode == 0 and local.is_file() and local.read_bytes() != original.stdout:
                  raise SystemExit('EFHC_IMPORT_CONCURRENT_SOURCE_MODIFICATION: '+p)
              if p in files and original.returncode != 0 and local.exists():
                  raise SystemExit('EFHC_IMPORT_NEW_PATH_CONFLICT: '+p)
          for p, body in files.items():
              if not isinstance(body, str):
                  raise SystemExit('EFHC_IMPORT_NON_TEXT_SOURCE: '+p)
              target = validate(p)
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(body,encoding='utf-8')
              if p.endswith('.py'):
                  ast.parse(body,filename=p)
              if p.endswith('.json'):
                  json.loads(body)
          for p in deleted:
              target = validate(p)
              if target.is_file():
                  target.unlink()
          release = pathlib.Path('site/RELEASE.json')
          meta = json.loads(release.read_text(encoding='utf-8'))
          meta['source_version']='CYCLE0032_DEMO_BACKEND'
          meta['source_archive_name']='efhc.cycle0032.github-import.v1.json.gz'
          meta['source_archive_sha256']=expected
          meta['runtime_files_imported']=len(list(pathlib.Path('site/frontend').rglob('*')))
          for key, target in [
              ('pages_workflow_sha256','.github/workflows/efhc-pages.yml')
          ]:
              meta[key]=hashlib.sha256(pathlib.Path(target).read_bytes()).hexdigest()
          for name in list(meta.get('pages_tools_sha256',{})):
              target=pathlib.Path('site/ci/pages-tools')/name
              if target.is_file():
                  meta['pages_tools_sha256'][name]=hashlib.sha256(target.read_bytes()).hexdigest()
          release.write_text(json.dumps(meta,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('EFHC_CYCLE0032_SOURCE_APPLIED=71 updated_added 43 deleted; protected backend untouched')
          PY
          (
            cd site/frontend
            npm ci --ignore-scripts --no-audit --no-fund
            node --test tests/regression/current-demo-backend-transport.test.mjs tests/regression/current-pages-base-path.test.mjs tests/parity/contracts.test.mjs
          )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -- .efhc-cycle0032/import_payload.b64.txt
          printf '\nsite/frontend/node_modules/\n' >> .git/info/exclude
          git add -A
          # Contents-only workflow token cannot commit .github/workflows changes.
          # Two updated workflow files are applied by the authorized GitHub connector.
          git restore --staged -- .github/workflows/efhc-pages.yml .github/workflows/efhc-parity.yml
          # Markdown hard-line break is valid; keep byte-identical README from local package.
          git diff --cached --check -- . ':(exclude)demo_backend/README.md'
          git commit -m 'feat(cycle0032): server-side demo_backend and React API migration [efhc-cycle0032-apply]'
          git push origin HEAD:refs/heads/cycle0032/demo-backend-migration
          echo 'EFHC_CYCLE0032_REMOTE_SOURCE_IMPORT=PASS'
