name: EFHC cycle0032 - React typecheck, regression and build

on:
  push:
    branches:
      - cycle0032/demo-backend-migration
    paths:
      - site/**
      - demo_backend/**
      - .github/workflows/efhc-cycle0032-frontend-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: efhc-cycle0032-frontend
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: site/frontend
    steps:
      - name: Checkout isolated source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/frontend/package-lock.json
      - name: Install lockfile dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript semantic typecheck
        run: npm run typecheck
      - name: Current regression suite
        run: npm run test:frontend-regression
      - name: Build real React static source for GitHub Pages
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_EFHC_DATA_SOURCE: demo_backend
          NEXT_PUBLIC_EFHC_DEMO_API_ORIGIN: https://demo.invalid
          NEXT_PUBLIC_EFHC_PAGES_PREVIEW: '1'
          NEXT_PUBLIC_EFHC_ADMIN_VISUAL_PROOF: '1'
          NEXT_PUBLIC_EFHC_OBSERVABILITY_VISUAL_PROOF: '1'
          NODE_OPTIONS: --max-old-space-size=6144
        run: ./node_modules/.bin/next build --webpack
