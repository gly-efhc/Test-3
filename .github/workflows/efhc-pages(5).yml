# EFHC Test-3 — manually build and deploy the committed React frontend.
# Requires importing a ZIP with efhc-import.yml first and enabling Pages/GitHub Actions.
name: EFHC — React DEMO Pages (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: efhc-test3-main
  cancel-in-progress: false

jobs:
  publish:
    name: Build real React and publish to Pages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Checkout imported React source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Validate committed import source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test -f site/RELEASE.json || { echo 'FAIL: run EFHC Import first (missing site/RELEASE.json)'; exit 1; }
          test -f site/frontend/package-lock.json || { echo 'FAIL: imported React source missing'; exit 1; }
          python3 - <<'PYCODE'
          import hashlib, json, pathlib, re
          info = json.loads(pathlib.Path('site/RELEASE.json').read_text(encoding='utf-8'))
          expected = info.get('source_archive_sha256', '')
          if not re.fullmatch(r'[0-9a-f]{64}', expected):
              raise SystemExit('FAIL: invalid RELEASE source archive SHA256')
          zips = sorted(pathlib.Path('import').glob('*.zip'))
          if len(zips) > 1:
              raise SystemExit('FAIL: multiple ZIP files in import/; retain only the currently imported ZIP')
          if zips:
              actual = hashlib.file_digest(zips[0].open('rb'), 'sha256').hexdigest()
              if actual != expected:
                  raise SystemExit('FAIL: ZIP does not match staged source; run import first')
          print('EFHC_COMMITTED_REACT_SOURCE_VERIFIED=' + expected)
          PYCODE
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import json
          print('source_sha=' + json.load(open('site/RELEASE.json'))['source_archive_sha256'])
          PYCODE

      - name: Restore bundled DEMO build tools (self-contained YAML)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/efhc-pages-tools"
          cat > "$RUNNER_TEMP/efhc-pages-tools/prepare_pages.py" <<'EFHC_BUNDLED_PREPARE_PAGES_PY'
          #!/usr/bin/env python3
          """Transform an ephemeral COPY of actual React source for safe static export.
          
          The imported source tree site/frontend is never changed by this script.
          """
          import argparse
          import json
          from pathlib import Path
          import shutil
          import sys
          
          NEXT_CONFIG = '''/** EFHC isolated GitHub Pages DEMO; generated for an ephemeral build only. */
          const basePath = process.env.EFHC_DEMO_BASEPATH || '';
          module.exports = {
            reactStrictMode: true,
            output: 'export',
            basePath,
            assetPrefix: basePath,
            trailingSlash: true,
            images: { unoptimized: true },
            typescript: { ignoreBuildErrors: false },
            experimental: { cpus: 2 },
          };
          '''
          
          SAFETY = r'''/* EFHC Pages DEMO: block external and live operations. */
          (function () {
            'use strict';
            var base = '__BASE_PATH__';
            var nativeFetch = window.fetch.bind(window);
            var apiHub = JSON.stringify([
              {id:1,code:'efhc_buy',title:'EFHC Shop',url:'#',sort_order:1,is_active:true},
              {id:2,code:'vip_getgems',title:'EFHC VIP NFT',url:'#',sort_order:2,is_active:true},
              {id:3,code:'efhc_ceo',title:'EFHC CEO',url:'#',sort_order:3,is_active:true},
              {id:4,code:'efhc_admin',title:'EFHC Admin',url:'#',sort_order:4,is_active:true}
            ]);
            function apiResponse(path) {
              var data = path.endsWith('/hub/links') ? apiHub : '{"detail":"EFHC_DEMO_READ_ONLY","demo":true}';
              return new Response(data, {status: path.endsWith('/hub/links') ? 200 : 503,
                headers: {'content-type':'application/json;charset=utf-8','cache-control':'no-store'}});
            }
            function isStatic(path) {
              return path.startsWith(base + '/_next/') || path.startsWith(base + '/assets/') ||
                path.startsWith(base + '/locale/') || path.startsWith(base + '/faq/') ||
                path.startsWith(base + '/audio/') || path.startsWith(base + '/fonts/') ||
                path === base + '/manifest.webmanifest' || path === base + '/favicon.ico';
            }
            window.__EFHC_DEMO_READ_ONLY__ = true;
            window.fetch = function(resource, init) {
              var raw = typeof resource === 'string' ? resource : resource && resource.url;
              var url;
              try { url = new URL(raw || '', location.href); } catch (_) { return Promise.resolve(apiResponse('/invalid')); }
              var method = String(init && init.method || resource && resource.method || 'GET').toUpperCase();
              if (url.pathname.startsWith('/api/') || url.pathname.startsWith(base + '/api/'))
                return Promise.resolve(apiResponse(url.pathname));
              if (url.origin !== location.origin || !['GET','HEAD'].includes(method))
                return Promise.resolve(apiResponse('/blocked'));
              if (isStatic(url.pathname) || url.pathname.startsWith(base + '/'))
                return nativeFetch(resource, init);
              return Promise.resolve(apiResponse('/blocked'));
            };
            var nativeOpen = XMLHttpRequest.prototype.open;
            var nativeSend = XMLHttpRequest.prototype.send;
            XMLHttpRequest.prototype.open = function(method,url) {
              this.__efhcBlocked = true;
              try {
                var parsed = new URL(url, location.href);
                this.__efhcBlocked = parsed.origin !== location.origin ||
                  !['GET','HEAD'].includes(String(method).toUpperCase()) ||
                  parsed.pathname.startsWith('/api/') || parsed.pathname.startsWith(base+'/api/');
              } catch (_) {}
              if (!this.__efhcBlocked) return nativeOpen.apply(this, arguments);
              return nativeOpen.call(this, 'GET', 'data:application/json,{"detail":"EFHC_DEMO_READ_ONLY"}', true);
            };
            XMLHttpRequest.prototype.send = function() {return nativeSend.apply(this,arguments);};
            try { navigator.sendBeacon = function(){return false;}; } catch (_) {}
            window.WebSocket = function(){throw new Error('EFHC_DEMO_NETWORK_DISABLED');};
            window.EventSource = function(){throw new Error('EFHC_DEMO_NETWORK_DISABLED');};
            var nativeWindowOpen = window.open;
            window.open = function(url) {
              try {if (new URL(url || '',location.href).origin !== location.origin) return null;} catch (_) {return null;}
              return nativeWindowOpen.apply(window,arguments);
            };
            document.addEventListener('click',function(event) {
              var target=event.target;
              var a=target && target.closest && target.closest('a[href]');
              if (!a) return;
              try {
                var url=new URL(a.href,location.href);
                if(url.origin !== location.origin || (!url.pathname.startsWith(base+'/') && url.pathname !== base)) {
                  event.preventDefault(); event.stopPropagation();
                }
              } catch(_) {event.preventDefault();}
            },true);
            try {
              if(navigator.serviceWorker) {
                navigator.serviceWorker.register = function(){return Promise.reject(new Error('EFHC_DEMO_NO_SERVICE_WORKER'));};
              }
            } catch(_) {}
          })();
          '''
          
          
          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument('--source', required=True)
              ap.add_argument('--target', required=True)
              ap.add_argument('--base-path', required=True)
              args = ap.parse_args()
              base = args.base_path.rstrip('/')
              if base and (not base.startswith('/') or '/' in base[1:] or base in ('/.', '/..')):
                  raise ValueError('base-path must be empty or /single-repository-name')
              source, target = Path(args.source), Path(args.target)
              if target.exists():
                  shutil.rmtree(target)
              shutil.copytree(source, target)
              # Exact-v866 TypeScript correctness repair for an ephemeral DEMO copy.
              # Preserve original site/frontend, authored visuals and persisted schema.
              # Both changes are skipped if newer source already has the correct form.
              app = target / 'src/pages/_app.tsx'
              app_source = app.read_text(encoding='utf-8')
              if ('const [settingsHydrated, setSettingsHydrated] = useState(false);' in app_source
                      and '<BackgroundMusicController enabled={settingsHydrated' in app_source
                      and 'function AppInner(props:' in app_source
                      and '  settingsHydrated: boolean;' not in app_source):
                  fixes = (
                      ('                setSettings={setSettings}\n                tgScheme={tgScheme}',
                       '                setSettings={setSettings}\n                settingsHydrated={settingsHydrated}\n                tgScheme={tgScheme}'),
                      ('  setSettings: Dispatch<SetStateAction<UserSettings>>;\n  tgScheme:',
                       '  setSettings: Dispatch<SetStateAction<UserSettings>>;\n  settingsHydrated: boolean;\n  tgScheme:'),
                      ('    setSettings,\n    tgScheme,',
                       '    setSettings,\n    settingsHydrated,\n    tgScheme,'),
                  )
                  for old, new in fixes:
                      if app_source.count(old) != 1:
                          raise ValueError('AppInner hydration source shape changed: stop rather than guess')
                      app_source = app_source.replace(old, new, 1)
                  app.write_text(app_source, encoding='utf-8')
                  print('EFHC_DEMO_TS_FIX_APPINNER_HYDRATION=PASS')
              layout = target / 'src/components/Layout.tsx'
              layout_source = layout.read_text(encoding='utf-8')
              old_version = '    interface_settings_version: 3,'
              if old_version in layout_source:
                  if layout_source.count(old_version) != 1:
                      raise ValueError('Layout fallback settings schema has unexpected duplicates')
                  layout_source = layout_source.replace(old_version,
                      '    interface_settings_version: 4,', 1)
                  layout.write_text(layout_source, encoding='utf-8')
                  print('EFHC_DEMO_TS_FIX_LAYOUT_SCHEMA=PASS')
              # Keep temporary LayoutContext fallback aligned with the required
              # sound default already present in canonical DEFAULT_SETTINGS.
              # Never turn on music by default or modify production source.
              fallback_header = layout_source.split('  setLang: () => undefined,', 1)[0]
              if '    music_enabled:' not in fallback_header and '    sfx_enabled: true,' in fallback_header:
                  old_music = '    sfx_enabled: true,\n    sfx_volume: 0.6,'
                  if layout_source.count(old_music) != 1:
                      raise ValueError('Layout fallback music default shape changed')
                  layout_source = layout_source.replace(old_music,
                      '    sfx_enabled: true,\n    music_enabled: false,\n    sfx_volume: 0.6,', 1)
                  layout.write_text(layout_source, encoding='utf-8')
                  print('EFHC_DEMO_TS_FIX_LAYOUT_MUSIC_DEFAULT=PASS')
              (target / 'next.config.js').write_text(NEXT_CONFIG, encoding='utf-8')
              # GitHub Pages cannot execute Next API handlers. Keep all real USER/ADMIN React pages.
              api = target / 'src/pages/api'
              if api.exists():
                  shutil.rmtree(api)
              # Pages Router custom _error has getInitialProps and cannot be statically exported.
              custom_error = target / 'src/pages/_error.tsx'
              if custom_error.exists():
                  custom_error.unlink()
              doc = target / 'src/pages/_document.tsx'
              content = doc.read_text(encoding='utf-8')
              if 'src="/public-runtime-config.js"' not in content:
                  raise ValueError('Expected runtime-config script not found in actual _document.tsx')
              content = content.replace('src="/public-runtime-config.js"',
                                        f'src="{base}/efhc-demo-safety.js"', 1)
              # Remove Telegram SDK remote script; mock mode has no external network.
              content = content.replace('<script src="https://telegram.org/js/telegram-web-app.js" async />','')
              # Static assets referenced directly from document are not basePath-rewritten by Next.
              content = content.replace('href="/assets/', f'href="{base}/assets/')
              doc.write_text(content, encoding='utf-8')
              safety = SAFETY.replace('__BASE_PATH__', base)
              (target / 'public/efhc-demo-safety.js').write_text(safety, encoding='utf-8')
              (target / 'public/sw.js').unlink(missing_ok=True)
              (target / 'public/runtime-config.json').unlink(missing_ok=True)
              (target / 'public/manifest.webmanifest').unlink(missing_ok=True)
              # The packaged browser demo never receives live service URLs.
              print(f'EFHC_PAGES_TEMP_BUILD_READY base={base!r} source={source} target={target}')
          
          
          if __name__ == '__main__':
              try:
                  main()
              except (OSError, ValueError) as exc:
                  print(f'EFHC_PAGES_PREPARE_FAIL: {exc}', file=sys.stderr)
                  raise SystemExit(1)
          EFHC_BUNDLED_PREPARE_PAGES_PY
          cat > "$RUNNER_TEMP/efhc-pages-tools/fix_pages_assets.py" <<'EFHC_BUNDLED_FIX_PAGES_ASSETS_PY'
          #!/usr/bin/env python3
          """Normalize original root-absolute public asset URLs for project Pages basePath.
          
          Do not rewrite actual React routes, JSON fixtures or API endpoints.
          """
          import argparse
          from pathlib import Path
          import re
          import sys
          
          PATTERN = re.compile(r'(["\'`(=])/(assets|locale|faq|audio|fonts|images|icons|favicon\.ico|manifest\.webmanifest)(?=[/?#"\'`\s)])')
          
          def main():
              ap=argparse.ArgumentParser()
              ap.add_argument('--directory',required=True)
              ap.add_argument('--base-path',required=True)
              args=ap.parse_args()
              root=Path(args.directory)
              base=args.base_path.rstrip('/')
              if not base or not re.fullmatch(r'/[A-Za-z0-9_.-]+',base):
                  raise ValueError('Invalid Pages repository basePath')
              changed=0
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix not in ('.html','.css','.js'):
                      continue
                  # Never alter the DEMO security blocker while fixing app assets.
                  if p.name=='efhc-demo-safety.js':
                      continue
                  original=p.read_text(encoding='utf-8')
                  updated=PATTERN.sub(lambda m:m.group(1)+base+'/'+m.group(2),original)
                  if updated!=original:
                      p.write_text(updated,encoding='utf-8')
                      changed+=1
              print(f'EFHC_DEMO_PUBLIC_ASSET_BASEPATH_OK files_rewritten={changed}')
          
          if __name__=='__main__':
              try:main()
              except (OSError,ValueError) as e:
                  print('EFHC_ASSET_REWRITE_FAIL '+str(e),file=sys.stderr)
                  raise SystemExit(1)
          EFHC_BUNDLED_FIX_PAGES_ASSETS_PY
          cat > "$RUNNER_TEMP/efhc-pages-tools/verify_export.py" <<'EFHC_BUNDLED_VERIFY_EXPORT_PY'
          #!/usr/bin/env python3
          """Fail closed if a Pages build has no actual compiled Next output."""
          import argparse
          import hashlib
          from pathlib import Path
          import re
          import sys
          
          def main():
              ap=argparse.ArgumentParser()
              ap.add_argument('--directory', required=True)
              ap.add_argument('--base-path', required=True)
              args=ap.parse_args()
              root=Path(args.directory)
              index=root/'index.html'
              if not index.is_file():
                  raise ValueError('Next static export missing index.html')
              content=index.read_text(encoding='utf-8')
              if '__NEXT_DATA__' not in content and '/_next/' not in content:
                  raise ValueError('index.html does not appear to be a Next.js build')
              js=list((root/'_next'/'static').rglob('*.js')) if (root/'_next'/'static').exists() else []
              css=list((root/'_next'/'static').rglob('*.css')) if (root/'_next'/'static').exists() else []
              if not js or not css:
                  raise ValueError('Next compiled JavaScript/CSS missing')
              base=args.base_path.rstrip('/')
              if base and base+'/_next/' not in content:
                  raise ValueError('Next static asset basePath was not applied')
              if not (root/'efhc-demo-safety.js').is_file():
                  raise ValueError('Read-only network safety file missing')
              # No backend code or uploaded physical/archive logs in Pages published directory.
              forbidden = [p for p in root.rglob('*') if p.is_file() and
                           (p.suffix.lower() in {'.zip','.log','.pem','.key','.db','.sqlite'} or
                            p.name.startswith('.env'))]
              if forbidden:
                  raise ValueError(f'Forbidden published asset: {forbidden[0]}')
              print(f'EFHC_PAGES_EXPORT_PASS js={len(js)} css={len(css)} pages={len(list(root.rglob("*.html")))}')
          
          if __name__=='__main__':
              try:
                  main()
              except (ValueError,OSError) as e:
                  print('EFHC_PAGES_EXPORT_FAIL: '+str(e),file=sys.stderr)
                  raise SystemExit(1)
          EFHC_BUNDLED_VERIFY_EXPORT_PY
          python3 -m py_compile "$RUNNER_TEMP"/efhc-pages-tools/*.py
          echo 'EFHC_BUNDLED_PAGES_TOOLS_READY=PASS'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/frontend/package-lock.json

      - name: Configure Pages (manual publish only)
        uses: actions/configure-pages@v5

      - name: Prepare isolated static DEMO from actual React
        shell: bash
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/efhc-pages-tools/prepare_pages.py" \
            --source site/frontend \
            --target "$RUNNER_TEMP/efhc-demo-build" \
            --base-path "/${REPO_NAME}"

      - name: Install exact frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/efhc-demo-build"
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Compile actual React/Next for Pages (no backend)
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_EFHC_E2E_TONCONNECT_MOCK: '1'
          NEXT_PUBLIC_EFHC_E2E_DISABLE_TONCONNECT_RESTORE: '1'
          NEXT_PUBLIC_EFHC_ADMIN_VISUAL_PROOF: '1'
          NEXT_PUBLIC_EFHC_OBSERVABILITY_VISUAL_PROOF: '1'
          NODE_OPTIONS: '--max-old-space-size=6144'
          EFHC_DEMO_BASEPATH: /${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/efhc-demo-build"
          ./node_modules/.bin/next build --webpack

      - name: Correct absolute public asset URLs for project Pages
        shell: bash
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/efhc-pages-tools/fix_pages_assets.py" \
            --directory "$RUNNER_TEMP/efhc-demo-build/out" \
            --base-path "/${REPO_NAME}"

      - name: Fail closed if real React static export is missing
        shell: bash
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/efhc-pages-tools/verify_export.py" \
            --directory "$RUNNER_TEMP/efhc-demo-build/out" \
            --base-path "/${REPO_NAME}"

      - name: Upload compiled React to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/efhc-demo-build/out

      - name: Deploy real React to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cleanup:
    name: Remove matching source ZIP only after successful deployment
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Verify current release and remove deployed transport ZIP
        shell: bash
        env:
          PUBLISHED_SHA: ${{ needs.publish.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, re
          info = json.loads(pathlib.Path('site/RELEASE.json').read_text(encoding='utf-8'))
          expected = os.environ['PUBLISHED_SHA']
          if not re.fullmatch(r'[0-9a-f]{64}', expected):
              raise SystemExit('FAIL: published source hash missing')
          if info.get('source_archive_sha256') != expected:
              raise SystemExit('FAIL: imported source changed since deployment; preserving ZIP')
          zips = sorted(pathlib.Path('import').glob('*.zip'))
          if len(zips) > 1:
              raise SystemExit('FAIL: unexpected multiple ZIP files; none removed')
          if zips:
              with zips[0].open('rb') as f:
                  actual = hashlib.file_digest(f, 'sha256').hexdigest()
              if actual != expected:
                  raise SystemExit('FAIL: newer/unexpected ZIP; none removed')
              zips[0].unlink()
              print('EFHC_DEPLOYED_SOURCE_ZIP_REMOVED=' + expected)
          else:
              print('EFHC_TRANSPORT_ALREADY_CLEAN=PASS')
          if not pathlib.Path('import/README.md').is_file():
              raise SystemExit('FAIL: protected import/README.md missing')
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- import/
          if ! git diff --cached --quiet; then
            git commit -m 'chore(demo): clean deployed transport ZIP [efhc-demo-import]'
            git push origin HEAD:main
          fi
          echo 'EFHC_POST_DEPLOY_IMPORT_CLEANUP=PASS'
