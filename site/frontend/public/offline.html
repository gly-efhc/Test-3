<!doctype html>
<html lang="mul">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EFHC offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;

        color: #f7d06a;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(92vw, 440px);
        border: 1px solid rgba(247, 208, 106, 0.28);
        border-radius: 24px;
        padding: 28px;
        background: rgba(8, 12, 18, 0.78);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
      }
      picture { display: block; margin-bottom: 14px; }
      img { width: 72px; height: 72px; }
      h1 { margin: 0 0 10px; font-size: 28px; }
      p { margin: 0; color: #d7e8ff; line-height: 1.6; }

  </head>
  <body>
    <main>
      <picture>
        <source
          srcset="/assets/efhc/responsive/efhc_coin_128.avif"
          type="image/avif"
        />
        <source
          srcset="/assets/efhc/responsive/efhc_coin_128.webp"
          type="image/webp"
        />
        <img
          src="/assets/efhc/efhc_coin_192.png"
          alt="EFHC"
          width="72"
          height="72"
        />

      <h1>EFHC</h1>
