  <title>EFHC — read-only offline mode</title>
  <style>
    body{margin:0;background:#090b12;color:#f5f7ff;font:16px Arial,sans-serif}
    main{max-width:680px;margin:0 auto;padding:32px 20px 48px}
    article{border:1px solid #30384a;border-radius:18px;padding:20px;background:#121724}
    h1{font-size:24px;margin:0 0 12px}p{line-height:1.55;color:#cbd3e4}
    a{display:inline-block;margin:8px 8px 0 0;color:#fff;background:#2864ff;padding:11px 14px;border-radius:12px;text-decoration:none}
  </style>

<body>
<main>
  <article>
    <h1>EFHC read-only offline mode</h1>
    <p>FAQ, Privacy, Terms and public help remain available from the installed application cache. Balances, wallets, payments, withdrawals and Admin data require a live connection and are never served from persistent cache.</p>
    <a href="/faq">FAQ</a>
    <a href="/web-profile?legal=privacy">Privacy</a>
    <a href="/web-profile?legal=terms">Terms</a>
    <a href="/hub">Public help</a>
  </article>
